# Provision password_file with mosquitto_passwd before starting the broker.
listener 8883
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
cafile /mosquitto/secrets/ca.crt
persistence true
persistence_location /mosquitto/data/
max_packet_size 2000000
retain_available false
