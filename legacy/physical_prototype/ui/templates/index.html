<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 IPC Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0d6efd;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
            --info: #0dcaf0;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            color: #2c3e50;
            min-height: 100vh;
            padding: 20px 0;
        }

        .navbar {
            background: rgba(13, 110, 253, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dashboard-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.08);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(0, 0, 0, 0.12);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .rack-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .rack-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--info));
        }

        .rack-card:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(0, 0, 0, 0.12);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transform: translateY(-5px);
        }

        .rack-card.error-state::before {
            background: linear-gradient(90deg, #dc3545, #ff6b6b);
        }

        .rack-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .rack-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .rack-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-ok {
            background: rgba(25, 135, 84, 0.3);
            color: #7dda58;
        }

        .status-error {
            background: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .sensor-item {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .sensor-item:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.12);
        }

        .sensor-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .sensor-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 3px;
        }

        .sensor-unit {
            font-size: 0.75rem;
            color: #70a8d4;
        }

        .sensor-temp {
            border-left: 3px solid #e74c3c;
        }

        .sensor-humidity {
            border-left: 3px solid #16a085;
        }

        .sensor-gas {
            border-left: 3px solid #f39c12;
        }

        .chart-container {
            position: relative;
            height: 300px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .alert-danger-custom {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            color: #c82333;
        }

        .last-update {
            font-size: 0.8rem;
            color: #95a5a6;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, rgba(0,0,0,0.05), rgba(0,0,0,0.1), rgba(0,0,0,0.05));
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .container-fluid {
            max-width: 1400px;
            margin: 0 auto;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .title-main {
            color: #2c3e50;
            font-weight: bold;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #95a5a6;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .badge-count {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.8rem;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fas fa-server"></i> IPC Sensor Dashboard
            </span>
            <span style="color: rgba(255,255,255,0.8); font-size: 0.9rem;">
                <i class="fas fa-wifi"></i> Live Monitoring
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <!-- Header -->
        <div class="dashboard-header">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <div>
                    <div class="title-main">
                        <i class="fas fa-chart-line"></i> System Overview
                    </div>
                    <div class="subtitle">Monitoring of all racks and environmental sensors</div>
                </div>
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="row" id="summary-stats">
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-cube" style="color: var(--primary);"></i></div>
                    <div class="stat-label">Total Racks</div>
                    <div class="stat-value" id="total-racks">-</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-exclamation-triangle" style="color: var(--warning);"></i></div>
                    <div class="stat-label">Error Racks</div>
                    <div class="stat-value" id="error-racks">-<span class="badge-count" id="error-badge">0</span></div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-thermometer-half" style="color: #e74c3c;"></i></div>
                    <div class="stat-label">Avg Temperature</div>
                    <div class="stat-value"><span id="avg-temp">-</span><span style="font-size: 1.5rem;">°C</span></div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-cloud" style="color: #f39c12;"></i></div>
                    <div class="stat-label">Max Gas Level</div>
                    <div class="stat-value"><span id="max-gas">-</span></div>
                </div>
            </div>
        </div>

        <!-- Racks Container -->
        <div id="racks-container" class="fade-in">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3 style="color: #2c3e50;">No Data Available</h3>
            <p>Waiting for sensor data from ESP32...</p>
        </div>
    </div>

    <script>
        // ===== GLOBAL VARIABLES =====
        let charts = {}; // lưu trữ chart objects

        // ===== UTILITY FUNCTIONS =====
        function getStatusBadge(error) {
            if (error) {
                return '<span class="rack-status status-error"><i class="fas fa-times-circle"></i> ERROR</span>';
            }
            return '<span class="rack-status status-ok"><i class="fas fa-check-circle"></i> OK</span>';
        }

        function formatNumber(num, decimals = 1) {
            return Number(num).toFixed(decimals);
        }

        function getGasLevel(gas) {
            if (gas > 2000) return '<span style="color: #e74c3c;"><i class="fas fa-exclamation-circle"></i> DANGER</span>';
            if (gas > 1000) return '<span style="color: #f39c12;"><i class="fas fa-warning"></i> HIGH</span>';
            return '<span style="color: #27ae60;"><i class="fas fa-check-circle"></i> NORMAL</span>';
        }

        // ===== CHART CREATION FUNCTIONS =====
        function createOrUpdateTempHumidityChart(rackId, data) {
            const chartId = `chart-temp-humidity-${rackId}`;
            const ctx = document.getElementById(chartId);
            
            if (!ctx) return;

            const labels = data.map(d => d.time);
            const temps = data.map(d => d.temperature);
            const humidities = data.map(d => d.humidity);

            const chartKey = `${rackId}_temp_humidity`;

            if (charts[chartKey]) {
                // Update existing chart
                charts[chartKey].data.labels = labels;
                charts[chartKey].data.datasets[0].data = temps;
                charts[chartKey].data.datasets[1].data = humidities;
                charts[chartKey].update('none'); // silent update
            } else {
                // Create new chart
                charts[chartKey] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Temperature (°C)',
                                data: temps,
                                borderColor: '#e74c3c',
                                backgroundColor: 'rgba(231, 76, 60, 0.08)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 4,
                                pointBackgroundColor: '#e74c3c',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2,
                            },
                            {
                                label: 'Humidity (%)',
                                data: humidities,
                                borderColor: '#16a085',
                                backgroundColor: 'rgba(22, 160, 133, 0.08)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 4,
                                pointBackgroundColor: '#16a085',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#7f8c8d',
                                    font: { size: 11 },
                                    padding: 15,
                                    boxWidth: 12,
                                }
                            },
                            filler: {
                                propagate: true
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)',
                                    drawBorder: false,
                                },
                                ticks: {
                                    color: '#95a5a6',
                                    font: { size: 10 }
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)',
                                    drawBorder: false,
                                },
                                ticks: {
                                    color: '#95a5a6',
                                    font: { size: 10 }
                                }
                            }
                        }
                    }
                });
            }
        }

        function createOrUpdateGasChart(rackId, data) {
            const chartId = `chart-gas-${rackId}`;
            const ctx = document.getElementById(chartId);
            
            if (!ctx) return;

            const labels = data.map(d => d.time);
            const gases = data.map(d => d.gas);

            const chartKey = `${rackId}_gas`;

            if (charts[chartKey]) {
                // Update existing chart
                charts[chartKey].data.labels = labels;
                charts[chartKey].data.datasets[0].data = gases;
                charts[chartKey].update('none'); // silent update
            } else {
                // Create new chart
                charts[chartKey] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Gas Level (ppm)',
                                data: gases,
                                borderColor: '#f39c12',
                                backgroundColor: 'rgba(243, 156, 18, 0.08)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 4,
                                pointBackgroundColor: '#f39c12',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#7f8c8d',
                                    font: { size: 11 },
                                    padding: 15,
                                    boxWidth: 12,
                                }
                            },
                            filler: {
                                propagate: true
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)',
                                    drawBorder: false,
                                },
                                ticks: {
                                    color: '#95a5a6',
                                    font: { size: 10 }
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)',
                                    drawBorder: false,
                                },
                                ticks: {
                                    color: '#95a5a6',
                                    font: { size: 10 }
                                }
                            }
                        }
                    }
                });
            }
        }

        // ===== MAIN LOAD FUNCTIONS =====
        async function loadSummary() {
            try {
                const res = await fetch('/api/summary');
                const data = await res.json();

                document.getElementById('total-racks').textContent = data.total_racks;
                document.getElementById('error-racks').innerHTML = 
                    `${data.error_racks}${data.error_racks > 0 ? '<span class="badge-count">' + data.error_racks + '</span>' : ''}`;
                document.getElementById('avg-temp').textContent = formatNumber(data.avg_temperature);
                document.getElementById('max-gas').textContent = formatNumber(data.max_gas);
            } catch (e) {
                console.error('Error loading summary:', e);
            }
        }

        async function loadRacks() {
            try {
                const res = await fetch('/api/racks');
                const racks = await res.json();

                if (Object.keys(racks).length === 0) {
                    document.getElementById('racks-container').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                document.getElementById('racks-container').style.display = 'block';
                document.getElementById('empty-state').style.display = 'none';

                let html = '';
                
                for (const rackId in racks) {
                    const rack = racks[rackId];
                    const gasStatus = getGasLevel(rack.gas);
                    const statusBadge = getStatusBadge(rack.error);
                    const cardClass = rack.error ? 'error-state' : '';

                    html += `
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="rack-card ${cardClass}">
                                <div class="rack-header">
                                    <div>
                                        <div class="rack-title">
                                            <i class="fas fa-cube"></i> Rack ${rackId}
                                        </div>
                                        <small style="color: #95a5a6; font-size: 0.7rem;">ID: ${rackId} | Position: ${rack.position}</small>
                                    </div>
                                    <div>${statusBadge}</div>
                                </div>

                                <div class="sensor-grid">
                                    <div class="sensor-item sensor-temp">
                                        <div class="sensor-label"><i class="fas fa-thermometer-half"></i> Temperature</div>
                                        <div class="sensor-value">${formatNumber(rack.temperature)}</div>
                                        <div class="sensor-unit">°C</div>
                                    </div>
                                    <div class="sensor-item sensor-humidity">
                                        <div class="sensor-label"><i class="fas fa-droplet"></i> Humidity</div>
                                        <div class="sensor-value">${formatNumber(rack.humidity)}</div>
                                        <div class="sensor-unit">%</div>
                                    </div>
                                    <div class="sensor-item sensor-gas">
                                        <div class="sensor-label"><i class="fas fa-cloud"></i> Gas</div>
                                        <div class="sensor-value">${formatNumber(rack.gas)}</div>
                                        <div class="sensor-unit">ppm</div>
                                    </div>
                                </div>

                                <div style="font-size: 0.8rem; margin-bottom: 8px;">
                                    <strong>Gas Status:</strong> ${gasStatus}
                                </div>

                                ${rack.error ? `
                                    <div class="alert-danger-custom">
                                        <i class="fas fa-exclamation-circle"></i> <strong>System Error Detected!</strong>
                                    </div>
                                ` : ''}

                                <div class="last-update">
                                    <i class="fas fa-clock"></i>
                                    Last update: ${rack.last_update || 'N/A'}
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="rack-card">
                                <div style="margin-bottom: 8px;">
                                    <h6 style="color: #2c3e50; margin: 0; font-size: 0.9rem;"><i class="fas fa-thermometer-half"></i> Temperature & Humidity</h6>
                                </div>
                                <div class="chart-container">
                                    <canvas id="chart-temp-humidity-${rackId}"></canvas>
                                </div>
                            </div>
                            <div class="rack-card">
                                <div style="margin-bottom: 8px;">
                                    <h6 style="color: #2c3e50; margin: 0; font-size: 0.9rem;"><i class="fas fa-cloud"></i> Gas Level</h6>
                                </div>
                                <div class="chart-container">
                                    <canvas id="chart-gas-${rackId}"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }

                document.getElementById('racks-container').innerHTML = html;

                // Load charts for all racks
                for (const rackId in racks) {
                    loadChartData(rackId);
                }

            } catch (e) {
                console.error('Error loading racks:', e);
            }
        }

        async function loadChartData(rackId) {
            try {
                const res = await fetch(`/api/history/${rackId}`);
                const history = await res.json();

                if (history.length > 0) {
                    createOrUpdateTempHumidityChart(rackId, history);
                    createOrUpdateGasChart(rackId, history);
                }
            } catch (e) {
                console.error(`Error loading chart data for rack ${rackId}:`, e);
            }
        }

        // ===== INITIALIZATION =====
        function initialize() {
            loadSummary();
            loadRacks();
        }

        // Start on page load
        window.addEventListener('load', initialize);
        initialize();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            // Cleanup if needed
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
